# Run this workflow when a release is published (change types to include created/draft as you prefer)
name: Build & attach release assets

on:
  release:
    types: [published]

permissions:
  contents: write   # required to upload release assets

jobs:
  linux:
    name: Linux release asset
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Assemble app
        run: |
          ./gradlew assemble

      - name: Download JavaFX
        run: |
          chmod +x release-linux/download-jfx.sh
          cd release-linux/
          ./download-jfx.sh

      - name: Run Linux release script
        run: |
          chmod +x release-linux/make-release.sh
          cd release-linux/
          ./make-release.sh "$(pwd)/jfx-linux/" $JAVA_HOME

#      - name: Upload Linux asset to GitHub Release
#        uses: actions/upload-release-asset@v1
#        with:
#          upload_url: ${{ github.event.release.upload_url }}
#          asset_path: ./generated/release-linux.zip
#          asset_name: Vocabulary-Quiz-Linux.zip
#          asset_content_type: application/zip

      - name: Upload Linux asset to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: generated/release-linux.zip
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./generated/release-linux.zip
          asset_name: Vocabulary-Quiz-Linux.zip
          asset_content_type: application/zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  windows:
    name: Windows release asset
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download JavaFX
        run: |
          release-windows\download-jfx.bat

      - name: Run Windows release script
        shell: cmd
        run: |
          rem adjust path if needed
          .\release-windows\make-release.ps1 "$pwd\jfx-windows\" $env:JAVA_HOME

      - name: Upload Windows asset to GitHub Release
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./generated/release-windows.zip
          asset_name: Vocabulary-Quiz-Windows.zip
          asset_content_type: application/zip
