name: Build & attach release assets for Windows

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release-windows:
    name: Windows release asset
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Assemble app
        run: |
          .\gradlew.bat assemble

      - name: Download JavaFX
        run: |
          cd release-windows
          .\download-jfx.bat


      - name: Run Windows release script
        working-directory: release-windows
        run: |
          .\make-release.bat "..\jfx-windows\" "$env:JAVA_HOME"

      - name: Upload Windows asset to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: generated/Vocabulary-Helper-Windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}